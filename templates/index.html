{% extends "base.html" %}
{% block main %}
    
    <img alt="faxthemachine logo" class="px-3 mt-10 mb-2 mx-auto max-h-40 object-contain" src="{{ url_for('static', filename='faxthesystem.png') }}">
  
    <div class="flex flex-row justify-between px-12">
        <div class="text-center w-full ps-5">
            <h2 class="text-2xl pb-4">Envoyer un message</h2>
            <form class="pb-5" hx-post="{{ url_for('post') }}" hx-target="#result" hx-swap="innerHTML" >
                <div class="pb-1">
                    <label for="from">De la part de :</label>
                    <input class="mx-auto w-1/4 border border-dashed border-gray-400 rounded-md" type="text" id="from" name="from" placeholder="Pseudo" maxlength="30" required>
                </div>
                <textarea id="label-generator-text" class="rounded-md mb-5 block mx-auto w-1/2 border border-dashed border-gray-400" name="text" rows="2" style="box-shadow: none !important;" maxlength="500" required></textarea>
                <button class="mx-auto btn block !font-bold -rotate-3 !text-lg" style="background-image: url({{ url_for('static', filename='button.svg')}}); background-position: center; background-repeat: no-repeat; background-size: cover; width: 11.5rem; height: 4.5rem; color: #00426a;" type="submit">
                    Envoyer
                </button>
            </form>
            <div id="result">
            </div>
            <div id="facts" class="pb-10">
                Dernier check de l'imprimante : {{ last_pop }}<br/>
                Il y a actuellement {{ items_in_queue }} messages en attente.
            </div>
       </div>
    </div>
{% endblock %}
